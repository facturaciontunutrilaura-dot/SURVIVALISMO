<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estudio de Reels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#1d2030; --panel:#262a3d; --ink:#f3f3f7; --muted:#a2a7bd; --line:#3a3f58; --accent:#ff5a3c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.4 'Fredoka', system-ui, sans-serif; }
  header { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:24px; margin:0 12px 0 0; }
  main { display:grid; grid-template-columns:minmax(0,1fr) 440px; gap:16px; padding:16px; }
  @media (max-width:900px){ main { grid-template-columns:1fr; } }
  .stage { display:flex; flex-direction:column; align-items:center; gap:10px; }
  canvas { width:min(100%, 390px); aspect-ratio:9/16; border-radius:14px; box-shadow:0 8px 30px #0008; background:#000; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px; max-height:calc(100vh - 110px); overflow:auto; }
  .scene { border:1px solid var(--line); border-radius:10px; padding:10px; margin-bottom:10px; }
  .scene.active { border-color:var(--accent); box-shadow:0 0 0 2px #ff5a3c44; }
  .row { display:flex; gap:6px; align-items:center; margin-bottom:6px; flex-wrap:wrap; }
  label { font-size:12px; color:var(--muted); display:flex; gap:4px; align-items:center; }
  input, select, textarea, button { font:inherit; color:var(--ink); background:#1b1e2c; border:1px solid var(--line); border-radius:6px; }
  textarea { width:100%; min-height:56px; resize:vertical; padding:6px; }
  input[type=text] { flex:1; min-width:0; padding:6px; }
  input[type=number] { width:60px; padding:4px; }
  select { padding:4px; }
  button { padding:7px 12px; cursor:pointer; border-radius:8px; }
  button.primary { background:#f3f3f7; color:#1d2030; }
  button.rec { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.small { padding:3px 8px; font-size:13px; }
  .hint { font-size:12px; color:var(--muted); max-width:390px; text-align:center; }
  #status { font-size:13px; color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>🎬 Estudio de Reels</h1>
  <label>Escenario <select id="preset"></select></label>
  <button id="play" class="primary">▶ Reproducir</button>
  <button id="stop">■ Parar</button>
  <button id="record" class="rec">⬤ Exportar vídeo</button>
  <span id="status"></span>
</header>
<main>
  <div class="stage">
    <canvas id="cv" width="1080" height="1920"></canvas>
    <div class="hint">1080×1920 · Pon *asteriscos* alrededor de palabras para marcarlas en amarillo · Iconos: <span id="iconlist"></span></div>
  </div>
  <div class="panel">
    <div class="row">
      <input type="text" id="title" placeholder="Título del escenario">
      <label>Realismo <input type="number" id="realism" min="1" max="10"></label>
    </div>
    <div id="scenes"></div>
    <button id="add" class="small">+ Añadir escena</button>
    <button id="json" class="small">Copiar guion (JSON)</button>
  </div>
</main>

<script>
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height, GROUND = 1330, TAU = Math.PI*2;
const off = document.createElement('canvas'); off.width = W; off.height = H; const octx = off.getContext('2d');

// ---------- utilidades ----------
const hash = i => { const x = Math.sin(i*127.1+311.7)*43758.5453; return x - Math.floor(x); };
const clamp = (v,a=0,b=1) => Math.max(a, Math.min(b, v));
const ease = v => v<.5 ? 2*v*v : 1-Math.pow(-2*v+2,2)/2;
const back = v => { const c=1.9; return v<=0?0:1+(c+1)*Math.pow(v-1,3)+c*Math.pow(v-1,2); };
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); }
function fillC(x,y,r,c){ ctx.fillStyle=c; ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill(); }
function fillE(x,y,rx,ry,c){ ctx.fillStyle=c; ctx.beginPath(); ctx.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,TAU); ctx.fill(); }
function grad(y0,y1,c0,c1){ const g=ctx.createLinearGradient(0,y0,0,y1); g.addColorStop(0,c0); g.addColorStop(1,c1); return g; }
function line(x1,y1,x2,y2,w,c){ ctx.strokeStyle=c; ctx.lineWidth=w; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); }

// ---------- personaje ----------
// Devuelve la posición de la linterna (si la lleva) para iluminar escenas a oscuras.
function drawChar(o){
  const t=o.t, s=o.s||1, f=o.face||1, pose=o.pose;
  const col=Object.assign({skin:'#f4c39e',hair:'#3a2a22',jacket:'#ef7a2d',pants:'#2f4a6d',shoe:'#232323'}, o.col||{});
  const walk = ['andar','correr','zombi'].includes(pose);
  const speed = pose==='correr'?15 : pose==='zombi'?4.5 : 8.5;
  const sw = walk ? Math.sin(t*speed+(o.phase||0))*(pose==='correr'?.75:.45) : 0;
  let x=o.x, bob = walk ? -Math.abs(Math.cos(t*speed+(o.phase||0)))*12 : Math.sin(t*2.3)*4;
  if (pose==='alegre') bob = -Math.abs(Math.sin(t*5.5))*45;
  if (pose==='asustado') x += Math.sin(t*48)*4;
  const holds = o.prop && o.prop!=='mochila' && o.prop!=='ninguno';
  let aF=.15+Math.sin(t*2)*.05, aB=-.15;
  if (pose==='hablar') aF=1.0+Math.sin(t*3.1)*.35;
  if (pose==='andar'||pose==='correr') { aF=-sw*1.1; aB=sw*1.1; }
  if (pose==='asustado') { aF=2.65+Math.sin(t*22)*.08; aB=-2.65-Math.sin(t*22)*.08; }
  if (pose==='señalar') aF=2.25+Math.sin(t*4)*.06;
  if (pose==='alegre') { aF=2.8+Math.sin(t*9)*.25; aB=-2.8; }
  if (pose==='zombi') { aF=1.62+Math.sin(t*2)*.08; aB=1.5+Math.cos(t*2)*.08; }
  if (holds && ['idle','hablar','andar','correr'].includes(pose)) aF=1.25+Math.sin(t*2)*.04;

  ctx.save(); ctx.translate(x, o.y+bob); ctx.scale(s*f, s);
  const arm=(a,c,sx=0)=>{ const hx=sx+Math.sin(a)*105, hy=-235+Math.cos(a)*105; line(sx,-235,hx,hy,26,c); fillC(hx,hy,15,col.skin); return [hx,hy]; };
  const leg=(hx,a)=>{ const fx=hx+Math.sin(a)*110, fy=-120+Math.cos(a)*110; line(hx,-125,fx,fy,32,col.pants); fillE(fx+12,fy+4,24,13,col.shoe); };
  if (o.prop==='mochila'){ rr(-82,-262,48,120,16); ctx.fillStyle='#4f7a34'; ctx.fill(); rr(-90,-205,20,46,8); ctx.fillStyle='#3d6127'; ctx.fill(); }
  arm(aB, shade(col.jacket), -18);
  leg(-10, sw); leg(12, -sw);
  rr(-48,-262,96,150,34); ctx.fillStyle=col.jacket; ctx.fill();
  line(10,-250,10,-125,4,shade(col.jacket));
  if (o.prop==='mochila') line(-30,-255,-20,-150,10,'#3d6127');
  // cabeza
  const hy=-318;
  fillC(0,hy,64,col.skin);
  ctx.fillStyle=col.hair; ctx.beginPath(); ctx.arc(0,hy,66,Math.PI*1.02,Math.PI*1.98); ctx.quadraticCurveTo(20,hy-40,-66,hy-8); ctx.fill();
  if (o.zombie){ line(-30,hy-10,-10,hy+20,5,'#5c7a4a'); }
  const blink = ((t+(o.phase||0)) % 3.4) < .13;
  const scared = pose==='asustado', big = scared ? 15 : 11;
  for (const ex of [12,40]){
    if (blink) line(ex-9,hy-6,ex+9,hy-6,5,'#222');
    else { fillE(ex,hy-6,big,big+2,'#fff'); fillC(ex+3,hy-5,scared?5:o.zombie?3:6.5,'#1e1e1e'); }
  }
  // cejas
  const bw = scared ? -12 : o.mood==='preocupado' ? -6 : 0;
  line(2,hy-28+bw*.3,22,hy-30-bw*.4,5,col.hair); line(30,hy-30-bw*.4,50,hy-28+bw*.3,5,col.hair);
  // boca
  const mx=28, my=hy+28;
  if (scared) fillE(mx,my,12,15,'#7a1e1e');
  else if (o.talking) fillE(mx,my,13,3+10*Math.abs(Math.sin(t*13)),'#7a1e1e');
  else if (pose==='alegre') { ctx.fillStyle='#7a1e1e'; ctx.beginPath(); ctx.arc(mx,my-6,16,0,Math.PI); ctx.fill(); }
  else if (o.zombie) line(mx-12,my,mx+12,my+4,5,'#3b2a20');
  else { ctx.strokeStyle='#3b2a20'; ctx.lineWidth=5; ctx.beginPath(); ctx.arc(mx,my-10,12,.3,Math.PI-.3); ctx.stroke(); }
  fillE(52,hy+14,10,6,'rgba(255,110,110,.35)');
  // brazo delantero + objeto
  const [hx,hyy]=arm(aF, col.jacket, 22);
  let light=null;
  if (holds){
    ctx.save(); ctx.translate(hx,hyy);
    if (o.prop==='linterna'){ rr(-6,-14,62,28,8); ctx.fillStyle='#555b66'; ctx.fill(); rr(50,-20,22,40,6); ctx.fillStyle='#9aa3b0'; ctx.fill(); fillE(72,0,4,16,'#fff7c2');
      const m=ctx.getTransform(); light={x:m.e+72*m.a, y:m.f, dir:Math.sign(m.a)}; }
    if (o.prop==='radio'){ rr(-40,-70,90,62,10); ctx.fillStyle='#c8483a'; ctx.fill(); fillC(-12,-39,17,'#2a2a2a'); line(20,-56,40,-56,5,'#fff'); line(20,-40,40,-40,5,'#fff'); line(40,-70,62,-120,5,'#999');
      for (let k=0;k<3;k++){ const r=((t*60+k*30)%90)+20; ctx.strokeStyle=`rgba(255,255,255,${1-r/110})`; ctx.lineWidth=5; ctx.beginPath(); ctx.arc(62,-120,r,-1.2,0.2); ctx.stroke(); } }
    if (o.prop==='agua'){ rr(-16,-90,34,80,10); ctx.fillStyle='rgba(90,170,240,.9)'; ctx.fill(); rr(-8,-104,18,16,4); ctx.fillStyle='#2b6cb0'; ctx.fill(); }
    if (o.prop==='movil'){ rr(-18,-80,40,72,8); ctx.fillStyle='#222'; ctx.fill(); rr(-13,-74,30,58,4); ctx.fillStyle=(Math.floor(t*4)%2)?'#5ec8ff':'#ff5a5a'; ctx.fill(); }
    ctx.restore();
  }
  ctx.restore();
  return light;
}
function shade(hex){ const n=parseInt(hex.slice(1),16); const r=(n>>16)*.78|0, g=((n>>8)&255)*.78|0, b=(n&255)*.78|0; return `rgb(${r},${g},${b})`; }

function drawRobot(x,y,t,ph){
  const step=Math.sin(t*6+ph);
  ctx.save(); ctx.translate(x,y+Math.abs(step)*-6);
  line(-20,-90,-20+step*25,0,22,'#6b7280'); line(20,-90,20-step*25,0,22,'#6b7280');
  rr(-55,-230,110,145,18); ctx.fillStyle='#9ca3af'; ctx.fill();
  rr(-45,-320,90,80,16); ctx.fillStyle='#b8bec8'; ctx.fill();
  const glow=.6+.4*Math.sin(t*8+ph);
  fillC(-20,-282,11,`rgba(255,40,40,${glow})`); fillC(20,-282,11,`rgba(255,40,40,${glow})`);
  line(0,-320,0,-350,5,'#6b7280'); fillC(0,-354,8,'#ff3b3b');
  line(-55,-210,-100,-150+step*20,18,'#6b7280'); line(55,-210,100,-150-step*20,18,'#6b7280');
  rr(-30,-200,60,36,6); ctx.fillStyle='#374151'; ctx.fill();
  ctx.restore();
}

// ---------- fondos animados ----------
const BUILD=[[-20,760,180],[150,600,150],[290,820,140],[420,520,180],[590,690,150],[730,470,170],[890,640,200]];
function city(day, lightsOn){
  BUILD.forEach(([x,top,w],i)=>{
    ctx.fillStyle = day ? ['#7f93ad','#90a4bd','#6f86a3'][i%3] : ['#272c48','#2e3352','#222741'][i%3];
    ctx.fillRect(x,top,w,GROUND-top);
    for (let wy=top+40; wy<GROUND-60; wy+=75) for (let c=0;c<3;c++){
      const id=i*100+wy+c, on = lightsOn(id);
      ctx.fillStyle = day ? '#d6ecfa' : on ? '#ffd65a' : '#1a1e34';
      ctx.fillRect(x+18+c*(w-36)/3, wy, (w-36)/3-14, 40);
    }
  });
}
function ground(c1,c2){ ctx.fillStyle=c1; ctx.fillRect(0,GROUND,W,H-GROUND); ctx.fillStyle=c2; ctx.fillRect(0,GROUND,W,22); }
function clouds(t,c,n=4,y0=300){ for(let i=0;i<n;i++){ const x=((t*(25+i*8)+hash(i)*1400)%1500)-250, y=y0+hash(i+9)*260; fillE(x,y,110,42,c); fillE(x+60,y-25,70,45,c); fillE(x-50,y-15,60,35,c);} }
function stars(t){ for(let i=0;i<70;i++){ const a=.4+.6*Math.abs(Math.sin(t*2+i)); fillC(hash(i)*W, hash(i+50)*900, 2+hash(i+3)*2.5, `rgba(255,255,255,${a})`);} }
function flame(x,y,s,t,i){
  const fl=Math.sin(t*13+i*2)*.12+Math.sin(t*7.3+i)*.1;
  for (const [k,c] of [[1,'#e8452c'],[.68,'#ff9a2e'],[.38,'#ffe14d']]){
    const h=s*k*(1.6+fl), w=s*k*.62;
    ctx.fillStyle=c; ctx.beginPath(); ctx.moveTo(x-w,y);
    ctx.quadraticCurveTo(x-w*1.1,y-h*.5,x+Math.sin(t*9+i)*w*.4,y-h);
    ctx.quadraticCurveTo(x+w*1.1,y-h*.5,x+w,y); ctx.fill();
  }
}
function virusAt(x,y,r,rot,c){
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot);
  for(let k=0;k<8;k++){ const a=k*TAU/8; line(Math.cos(a)*r,Math.sin(a)*r,Math.cos(a)*r*1.45,Math.sin(a)*r*1.45,r*.16,c); fillC(Math.cos(a)*r*1.5,Math.sin(a)*r*1.5,r*.2,c); }
  fillC(0,0,r,c); fillC(-r*.3,-r*.2,r*.18,'rgba(255,255,255,.35)'); ctx.restore();
}
function house(x,y,s,c='#e9d3b0',roof='#b4533a'){
  ctx.fillStyle=c; ctx.fillRect(x,y-160*s,220*s,160*s);
  ctx.fillStyle=roof; ctx.beginPath(); ctx.moveTo(x-20*s,y-160*s); ctx.lineTo(x+110*s,y-260*s); ctx.lineTo(x+240*s,y-160*s); ctx.fill();
  ctx.fillStyle='#7a4b2e'; ctx.fillRect(x+90*s,y-90*s,44*s,90*s);
  ctx.fillStyle='#bfe3f7'; ctx.fillRect(x+25*s,y-130*s,45*s,40*s); ctx.fillRect(x+150*s,y-130*s,45*s,40*s);
}
function trefoil(x,y,r,c){
  ctx.fillStyle=c; for(let k=0;k<3;k++){ const a=-Math.PI/2+k*TAU/3; ctx.beginPath(); ctx.moveTo(x,y); ctx.arc(x,y,r,a-.52,a+.52); ctx.fill(); }
  fillC(x,y,r*.28,'#222'); fillC(x,y,r*.18,c);
}

const BG = {
  ciudad(t){ ctx.fillStyle=grad(0,GROUND,'#7cc8f2','#d4efff'); ctx.fillRect(0,0,W,H);
    ctx.save(); ctx.translate(880,430); ctx.rotate(t*.3); for(let k=0;k<12;k++){ ctx.rotate(TAU/12); line(0,95,0,125,10,'#ffd34d'); } ctx.restore(); fillC(880,430,80,'#ffd34d');
    clouds(t,'#fff'); city(true,()=>0); ground('#5a5f6b','#6fbf5a');
    for(let i=0;i<6;i++) line(i*200+((t*80)%200)-100,GROUND+200,i*200+((t*80)%200)-20,GROUND+200,10,'#e6e6e6'); return {}; },
  apagon(t,p){ ctx.fillStyle=grad(0,GROUND,'#0d1230','#2a2f5c'); ctx.fillRect(0,0,W,H); stars(t); fillC(860,330,60,'#f2f0d8'); fillC(885,315,55,'#141a3d');
    city(false,id=>{ const th=.12+hash(id)*.22; return p<th || (p<th+.04 && Math.sin(t*60+id)>0); });
    ground('#1b1d2a','#262a3b'); return {dark: clamp((p-.12)/.25)*.62}; },
  salon(t){ ctx.fillStyle='#f3dcb8'; ctx.fillRect(0,0,W,GROUND); ctx.fillStyle='#e7cba0'; for(let x=0;x<W;x+=90) ctx.fillRect(x,0,45,GROUND);
    rr(620,420,330,380,10); ctx.fillStyle='#8a5a3c'; ctx.fill(); ctx.fillStyle=grad(440,780,'#7cc8f2','#cdeeff'); ctx.fillRect(640,440,290,340); line(785,440,785,780,10,'#8a5a3c'); clouds(t*.6,'#fff',2,520);
    rr(560,1060,460,200,40); ctx.fillStyle='#5876b8'; ctx.fill(); rr(540,1000,90,260,30); ctx.fill(); rr(950,1000,90,260,30); ctx.fill();
    ground('#b97c4c','#9a6238'); return {}; },
  salon_noche(t){ BG.salon(t); return {dark:.6}; },
  calor(t){ ctx.fillStyle=grad(0,GROUND,'#ff9a3c','#ffe08a'); ctx.fillRect(0,0,W,H); const r=140+Math.sin(t*3)*12; fillC(800,420,r+40,'rgba(255,240,150,.35)'); fillC(800,420,r,'#fff3a0');
    ctx.strokeStyle='rgba(255,255,255,.45)'; ctx.lineWidth=6; for(let i=0;i<7;i++){ const bx=80+i*150, by=GROUND-((t*120+i*90)%600); ctx.beginPath(); for(let k=0;k<6;k++) ctx.lineTo(bx+Math.sin(k*1.5+t*4)*14, by-k*25); ctx.stroke(); }
    ctx.fillStyle='#c98a43'; ctx.beginPath(); ctx.moveTo(0,GROUND); ctx.quadraticCurveTo(300,1050,620,GROUND); ctx.fill(); ctx.beginPath(); ctx.moveTo(450,GROUND); ctx.quadraticCurveTo(800,1000,1100,GROUND); ctx.fill();
    ground('#d9a35a','#c08a44'); return {}; },
  incendio(t){ ctx.fillStyle=grad(0,GROUND,'#4a2c2c','#f08a4b'); ctx.fillRect(0,0,W,H);
    for(let i=0;i<14;i++){ const k=(t*.12+hash(i))%1; fillC(hash(i+4)*W+Math.sin(t+i)*40, 1000-k*900, 60+k*120, `rgba(70,60,60,${.45*(1-k)})`); }
    ctx.fillStyle='#4e3a2a'; ctx.beginPath(); ctx.moveTo(-50,GROUND); ctx.quadraticCurveTo(400,800,1130,GROUND); ctx.fill();
    for(let i=0;i<9;i++){ const fx=60+i*115, fy=GROUND-Math.sin(clamp((fx+50)/1180)*Math.PI)*250+20; flame(fx,fy,60+hash(i)*40,t,i); }
    house(720,GROUND+5,.9); ground('#3b2b20','#5a3d24');
    for(let i=0;i<25;i++){ const k=(t*.5+hash(i))%1; fillC(hash(i+7)*W, GROUND-k*900, 5, `rgba(255,180,60,${1-k})`); } return {}; },
  inundacion(t,p){ ctx.fillStyle=grad(0,GROUND,'#4a5566','#8b97a8'); ctx.fillRect(0,0,W,H); clouds(t,'#5b6577',5,200);
    if ((t%4.3)<.09) { ctx.fillStyle='rgba(255,255,255,.7)'; ctx.fillRect(0,0,W,H); }
    house(80,GROUND,1.1); house(620,GROUND,1.25,'#cfd8e3','#5a6b8a'); ground('#4a4a4a','#5f5f5f');
    const lev=GROUND+20-ease(clamp(p*1.3))*420;
    return { front(){
      ctx.fillStyle='rgba(84,120,160,.88)'; ctx.beginPath(); ctx.moveTo(0,H);
      for(let x=0;x<=W;x+=30) ctx.lineTo(x, lev+Math.sin(x/70+t*3)*14); ctx.lineTo(W,H); ctx.fill();
      const cy=lev+Math.sin(t*2)*10, cx=(t*40)%1400-200; ctx.save(); ctx.translate(cx,cy); ctx.rotate(Math.sin(t*1.5)*.1);
      rr(-100,-70,200,60,20); ctx.fillStyle='#d13d3d'; ctx.fill(); rr(-60,-115,110,50,16); ctx.fill(); ctx.fillStyle='#bfe3f7'; ctx.fillRect(-48,-105,40,32); ctx.fillRect(0,-105,40,32); ctx.restore();
      ctx.strokeStyle='rgba(210,225,240,.7)'; ctx.lineWidth=4; for(let i=0;i<130;i++){ const x=hash(i)*W, y=(hash(i+200)*H+t*1400)%H; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x-12,y+45); ctx.stroke(); } } }; },
  ciber(t){ ctx.fillStyle='#0b1020'; ctx.fillRect(0,0,W,H); ctx.font='34px monospace'; ctx.fillStyle='rgba(60,255,140,.35)';
    for(let i=0;i<24;i++){ const x=i*46, y=(hash(i)*H+t*300)%H; for(let k=0;k<8;k++) ctx.fillText(hash(i*9+k+Math.floor(t*6))>.5?'1':'0', x, y-k*40); }
    const fr=Math.floor(t*8);
    for(let r=0;r<2;r++) for(let c=0;c<3;c++){ const x=90+c*320, y=380+r*330, g=hash(fr+r*3+c)>.7;
      rr(x,y,260,200,14); ctx.fillStyle='#1f2a44'; ctx.fill(); ctx.fillStyle=g?'#ff3b3b':'#122036'; ctx.fillRect(x+15,y+15,230,170);
      ctx.fillStyle='#fff'; ctx.font='bold 46px Fredoka'; ctx.textAlign='center'; ctx.fillText(g?'ERROR':'!', x+130, y+115); ctx.textAlign='left';

function drawIcons(list,t,p,withChar){
  const n=list.length; if(!n) return;
  const cols = withChar ? (n>3?2:1) : Math.min(3,n);
  const cell = withChar ? 230 : 300, x0 = withChar ? (cols===1?800:690) : W/2-(cols-1)*cell/2, y0 = withChar ? 560 : 600;
  list.forEach((k,i)=>{
    if(!ICON[k]) return;
    const ti=.08+i*(.5/n), sc=back(clamp((p-ti)/.14));
    if(sc<=0) return;
    const x=x0+(i%cols)*cell, y=y0+Math.floor(i/cols)*(cell+80)+Math.sin(t*2.2+i)*8;
    ctx.save(); ctx.translate(x,y); ctx.scale(sc,sc);
    fillC(0,0,105,'rgba(255,255,255,.92)'); ctx.strokeStyle='#222'; ctx.lineWidth=6; ctx.beginPath(); ctx.arc(0,0,105,0,TAU); ctx.stroke();
    ctx.save(); ctx.rotate(Math.sin(t*3+i)*.06); ICON[k](); ctx.restore();
    ctx.fillStyle='#222'; ctx.font='bold 40px Fredoka'; ctx.textAlign='center';
    rr(-95,118,190,54,27); ctx.fillStyle='#222'; ctx.fill(); ctx.fillStyle='#fff'; ctx.fillText(NAMES[k],0,158);
    ctx.restore();
  });
}

function darkness(alpha, light){
  octx.clearRect(0,0,W,H); octx.fillStyle=`rgba(4,6,22,${alpha})`; octx.fillRect(0,0,W,H);
  if (light){
    octx.globalCompositeOperation='destination-out';
    const g=octx.createRadialGradient(light.x,light.y,10,light.x,light.y,700); g.addColorStop(0,'rgba(0,0,0,1)'); g.addColorStop(1,'rgba(0,0,0,0)');
    octx.fillStyle=g; octx.beginPath(); octx.moveTo(light.x,light.y); octx.lineTo(light.x+light.dir*750,light.y-260); octx.lineTo(light.x+light.dir*750,light.y+300); octx.fill();
    octx.globalCompositeOperation='source-over';
  }
  ctx.drawImage(off,0,0);
  if (light){ ctx.fillStyle='rgba(255,240,170,.13)'; ctx.beginPath(); ctx.moveTo(light.x,light.y); ctx.lineTo(light.x+light.dir*750,light.y-260); ctx.lineTo(light.x+light.dir*750,light.y+300); ctx.fill(); }
}

function subtitles(text, progress){
  const words=text.split(/\s+/).filter(Boolean), shown=Math.ceil(words.length*clamp(progress));
  ctx.font='bold 70px Fredoka'; ctx.textAlign='left';
  const maxW=W-200, lh=92, sp=ctx.measureText(' ').width, lines=[[]]; let lw=0;
  for (const w of words){ const ww=ctx.measureText(w.replace(/\*/g,'')).width; if(lw+ww>maxW && lines.at(-1).length){lines.push([]);lw=0;} lines.at(-1).push(w); lw+=ww+sp; }
  const boxH=lines.length*lh+60, by=1440+Math.max(0,(4-lines.length))*lh/2-20;
  rr(60,by,W-120,boxH,36); ctx.fillStyle='rgba(255,255,255,.95)'; ctx.fill();
  let i=0, y=by+30+lh*.75, hl=false;
  for (const ln of lines){
    const lineW=ln.reduce((a,w)=>a+ctx.measureText(w.replace(/\*/g,'')).width+sp,0)-sp; let x=(W-lineW)/2;
    for (const w of ln){
      if (w.startsWith('*')) hl=true;
      const clean=w.replace(/\*/g,''), ww=ctx.measureText(clean).width;
      if (i<shown){
        if (hl){ ctx.fillStyle='#ffd84d'; ctx.fillRect(x-6,y-56,ww+12,72); }
        const pop = i===shown-1 ? back(clamp((progress*words.length-(shown-1)))) : 1;
        ctx.save(); ctx.translate(x+ww/2,y-20); ctx.scale(pop,pop); ctx.fillStyle='#1b1b1b'; ctx.fillText(clean,-ww/2,20); ctx.restore();
      }
      if (w.replace(/[.,:;!?)]+$/,'').endsWith('*')) hl=false;
      x+=ww+sp; i++;
    }
    y+=lh;
  }
}

function render(t){
  const ends=[]; let acc=0; for(const s of sc.scenes){ acc+=s.dur; ends.push(acc); }
  let idx=ends.findIndex(e=>t<e); if(idx<0) idx=sc.scenes.length-1;
  const s=sc.scenes[idx];
  if (!s){ ctx.fillStyle='#222'; ctx.fillRect(0,0,W,H); header(); return; }
  const local=t-(ends[idx]-s.dur), p=local/s.dur;
  const env=(BG[s.fondo]||BG.neutro)(t,p)||{};
  ctx.save();
  if (env.shake) ctx.translate((hash(Math.floor(t*30))-.5)*env.shake, (hash(Math.floor(t*30)+7)-.5)*env.shake);
  env.mid?.();
  let light=null; const hasChar=s.accion && s.accion!=='ninguno';
  if (hasChar){
    let x=320, face=1;
    if (s.accion==='andar') x=180+p*420;
    if (s.accion==='correr'){ x=820-p*720; face=-1; }
    const icons=(s.iconos||'').split(',').map(v=>v.trim()).filter(Boolean);
    if (!icons.length && ['hablar','asustado','alegre','señalar'].includes(s.accion)) x=W/2-60;
    light=drawChar({t, x, y:GROUND+10, s:1.4, face, pose:s.accion==='hablar'?'hablar':s.accion, prop:s.objeto, talking:p<.62 && s.accion!=='asustado'});
  }
  env.front?.();
  if (env.dark) darkness(env.dark, light);
  ctx.restore();
  drawIcons((s.iconos||'').split(',').map(v=>v.trim()).filter(Boolean), t, p, hasChar);
  header();
  subtitles(s.text, p/.6);
  ctx.font='bold 30px Fredoka'; ctx.textAlign='center'; ctx.fillStyle='rgba(0,0,0,.45)'; ctx.fillText(`${idx+1} / ${sc.scenes.length}`, W/2, H-60);
  if (local<.25 && idx>0){ ctx.fillStyle=`rgba(255,255,255,${1-local/.25})`; ctx.fillRect(0,0,W,H); }
  document.querySelectorAll('.scene').forEach((el,i)=>el.classList.toggle('active', i===idx));
}

function totalDur(){ return sc.scenes.reduce((a,s)=>a+s.dur,0); }
function loop(now){
  const t=(now-t0)/1000;
  if (t>=totalDur()){ render(totalDur()-.001); playing=false; const f=onEnd; onEnd=null; f&&f(); return; }
  render(t); rafId=requestAnimationFrame(loop);
}
function play(cb){ cancelAnimationFrame(rafId); playing=true; onEnd=cb||null; t0=performance.now(); rafId=requestAnimationFrame(loop); }
function stop(){ cancelAnimationFrame(rafId); playing=false; onEnd=null; }
function preview(i,frac=.75){ if(playing) return; let t=0; for(let k=0;k<i;k++) t+=sc.scenes[k].dur; render(t+(sc.scenes[i]?.dur||1)*frac); }

// ---------- editor ----------
const OPT = (list,v) => list.map(k=>`<option ${k===v?'selected':''}>${k}</option>`).join('');
const FONDOS=Object.keys(BG), ACCIONES=['hablar','andar','correr','asustado','señalar','alegre','ninguno'], OBJETOS=['ninguno','linterna','radio','agua','movil','mochila'];
document.getElementById('iconlist').textContent=Object.keys(ICON).join(', ');
const $scenes=document.getElementById('scenes');
function buildEditor(){
  document.getElementById('title').value=sc.title;
  document.getElementById('realism').value=sc.realism;
  $scenes.innerHTML='';
  sc.scenes.forEach((s,i)=>{
    const el=document.createElement('div'); el.className='scene';
    el.innerHTML=`<div class="row"><b>Escena ${i+1}</b>
      <label>seg <input type="number" min="1" max="30" step=".5" data-k="dur" value="${s.dur}"></label>
      <button class="small" data-a="see">👁</button><button class="small" data-a="up">↑</button><button class="small" data-a="del">✕</button></div>
      <div class="row"><label>Fondo <select data-k="fondo">${OPT(FONDOS,s.fondo)}</select></label>
      <label>Acción <select data-k="accion">${OPT(ACCIONES,s.accion)}</select></label>
      <label>Objeto <select data-k="objeto">${OPT(OBJETOS,s.objeto)}</select></label></div>
      <div class="row"><label style="flex:1">Iconos <input type="text" data-k="iconos" placeholder="agua, radio…"></label></div>
      <textarea data-k="text"></textarea>`;
    el.querySelector('[data-k=iconos]').value=s.iconos;
    el.querySelector('[data-k=text]').value=s.text;
    el.addEventListener('input',()=>{
      for (const k of ['fondo','accion','objeto','iconos','text']) s[k]=el.querySelector(`[data-k=${k}]`).value;
      s.dur=Math.max(1,+el.querySelector('[data-k=dur]').value||5);
      preview(i);
    });
    el.querySelector('[data-a=see]').onclick=()=>preview(i);
    el.querySelector('[data-a=del]').onclick=()=>{ sc.scenes.splice(i,1); buildEditor(); preview(0); };
    el.querySelector('[data-a=up]').onclick=()=>{ if(i){ [sc.scenes[i-1],sc.scenes[i]]=[sc.scenes[i],sc.scenes[i-1]]; buildEditor(); preview(i-1);} };
    $scenes.appendChild(el);
  });
}
const $preset=document.getElementById('preset');
$preset.innerHTML=PRESETS.map((p,i)=>`<option value="${i}">${i+1}. ${p.title} (${p.realism}/10)</option>`).join('');
$preset.onchange=()=>{ stop(); sc=structuredClone(PRESETS[+$preset.value]); buildEditor(); preview(0); };
document.getElementById('title').oninput=e=>{ sc.title=e.target.value; preview(0); };
document.getElementById('realism').oninput=e=>{ sc.realism=clamp(+e.target.value||1,1,10); preview(0); };
document.getElementById('add').onclick=()=>{ sc.scenes.push(S('neutro','hablar','ninguno','','Nueva escena')); buildEditor(); preview(sc.scenes.length-1); };
document.getElementById('json').onclick=()=>{ navigator.clipboard?.writeText(JSON.stringify(sc,null,2)); status('Guion copiado'); };
document.getElementById('play').onclick=()=>play();
document.getElementById('stop').onclick=()=>{ stop(); preview(0); };
const $status=document.getElementById('status'); function status(m){ $status.textContent=m; }

document.getElementById('record').onclick=()=>{
  if (!window.MediaRecorder) return status('Este navegador no graba vídeo. Usa Chrome o Edge.');
  const mime=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm'].find(t=>MediaRecorder.isTypeSupported(t))||'';
  const rec=new MediaRecorder(cv.captureStream(30), {mimeType:mime, videoBitsPerSecond:8e6});
  const chunks=[]; rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  rec.onstop=()=>{
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(chunks,{type:mime||'video/webm'}));
    a.download=`${sc.title.replace(/[^\wáéíóúñ ]/gi,'').trim().replace(/\s+/g,'-')}.${mime.includes('mp4')?'mp4':'webm'}`;
    document.body.appendChild(a); a.click(); a.remove(); status('Vídeo descargado ✔');
  };
  rec.start(); status(`Grabando… ${totalDur()} s (no cambies de pestaña)`);
  play(()=>setTimeout(()=>rec.stop(),300));
};

document.fonts.load('bold 70px Fredoka').finally(()=>{ buildEditor(); preview(0); });
</script>
