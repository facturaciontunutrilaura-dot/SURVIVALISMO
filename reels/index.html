<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estudio de Reels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f4efe4; --panel:#fffdf7; --ink:#1d1d1d; --muted:#6b6b6b; --line:#ddd5c4; --accent:#c8372d; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.4 system-ui, sans-serif; }
  header { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header h1 { font:26px 'Gochi Hand', cursive; margin:0 12px 0 0; }
  main { display:grid; grid-template-columns:minmax(0,1fr) 420px; gap:16px; padding:16px; }
  @media (max-width:900px){ main { grid-template-columns:1fr; } }
  .stage { display:flex; flex-direction:column; align-items:center; gap:10px; }
  canvas { width:min(100%, 380px); aspect-ratio:9/16; background:#fff; border:1px solid var(--line); border-radius:12px; box-shadow:0 4px 16px #0002; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px; max-height:calc(100vh - 110px); overflow:auto; }
  .scene { border:1px solid var(--line); border-radius:10px; padding:10px; margin-bottom:10px; background:#fff; }
  .scene.active { border-color:var(--accent); box-shadow:0 0 0 2px #c8372d33; }
  .scene .row { display:flex; gap:6px; align-items:center; margin-bottom:6px; flex-wrap:wrap; }
  label { font-size:12px; color:var(--muted); }
  input, select, textarea, button { font:inherit; }
  textarea { width:100%; min-height:56px; resize:vertical; padding:6px; border:1px solid var(--line); border-radius:6px; }
  input[type=text] { flex:1; min-width:0; padding:6px; border:1px solid var(--line); border-radius:6px; }
  input[type=number] { width:64px; padding:4px; border:1px solid var(--line); border-radius:6px; }
  select { padding:5px; border:1px solid var(--line); border-radius:6px; background:#fff; }
  button { padding:7px 12px; border:1px solid var(--ink); border-radius:8px; background:#fff; cursor:pointer; }
  button.primary { background:var(--ink); color:#fff; }
  button.rec { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.small { padding:3px 8px; font-size:13px; }
  .hint { font-size:12px; color:var(--muted); }
  #status { font-size:13px; color:var(--muted); min-height:1.2em; }
</style>
</head>
<body>
<header>
  <h1>✏️ Estudio de Reels</h1>
  <label>Escenario <select id="preset"></select></label>
  <button id="play" class="primary">▶ Reproducir</button>
  <button id="stop">■ Parar</button>
  <button id="record" class="rec">⬤ Exportar vídeo</button>
  <span id="status"></span>
</header>
<main>
  <div class="stage">
    <canvas id="cv" width="1080" height="1920"></canvas>
    <div class="hint">Formato 1080×1920 (Reels / TikTok / Shorts). Pon *asteriscos* alrededor de una palabra para resaltarla en rojo.</div>
  </div>
  <div class="panel">
    <div class="row" style="display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap">
      <input type="text" id="title" placeholder="Título del escenario">
      <label>Realismo <input type="number" id="realism" min="1" max="10"></label>
    </div>
    <div id="scenes"></div>
    <button id="add" class="small">+ Añadir escena</button>
    <button id="json" class="small">Copiar guion (JSON)</button>
  </div>
</main>

const R = (x,y,w,h) => [[x,y],[x+w,y],[x+w,y+h],[x,y+h],[x,y]];
const A = (cx,cy,rx,ry,a0=0,a1=360) => { const p=[]; for(let a=a0;a<=a1;a+=10){const r=a*Math.PI/180;p.push([cx+rx*Math.cos(r),cy+ry*Math.sin(r)]);} return p; };
const C = (cx,cy,r) => A(cx,cy,r,r);
const shift = (strokes,dx,dy,s=1) => strokes.map(st=>st.map(([x,y])=>[x*s+dx,y*s+dy]));
const person = (dx=0,dy=0,s=1) => shift([C(100,40,18), L(100,58,100,120), L(100,75,70,100), L(100,75,130,100), L(100,120,78,170), L(100,120,122,170)],dx,dy,s);

  robot: [R(70,30,60,45), C(88,52,6), C(112,52,6), L(100,30,100,15), C(100,12,4), R(60,80,80,70), L(60,95,35,125), L(140,95,165,125), L(80,150,80,180), L(120,150,120,180), R(85,100,30,20)],
  coche: [P([[25,130],[40,100],[70,95],[90,70],[140,70],[160,95],[180,105],[180,130],[25,130]]), C(60,135,15), C(150,135,15), L(95,75,95,95)],
  refugio: [P([[20,170],[60,110],[100,80],[140,110],[180,170]]), P([[80,170],[80,135],[120,135],[120,170]]), P([[20,170],[180,170]])],
  documentos: [R(55,35,90,125), R(65,45,90,125), L(80,75,140,75), L(80,95,140,95), L(80,115,120,115), C(125,145,12)],
  ojo: [P([[30,100],[65,70],[100,62],[135,70],[170,100],[135,130],[100,138],[65,130],[30,100]]), C(100,100,22), C(100,100,7)],
};

// ---------- Escenarios (de más realista a más ciencia ficción) ----------
const PRESETS = [

// ---------- Estado ----------
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
let sc = structuredClone(PRESETS[0]);
let playing = false, t0 = 0, rafId = 0, onEnd = null;

// ruido determinista para que el trazo tiemble igual en cada fotograma
function rnd(seed){ let s = seed*9301+49297; return () => (s = (s*9301+49297)%233280)/233280 - 0.5; }

function wobbly(stroke, seed){
  const r = rnd(seed), out = [];
  for (let i=0;i<stroke.length-1;i++){
    const [x1,y1]=stroke[i],[x2,y2]=stroke[i+1], n=Math.max(1,Math.ceil(Math.hypot(x2-x1,y2-y1)/14));
    for (let k=0;k<n;k++){ const f=k/n; out.push([x1+(x2-x1)*f+r()*2.2, y1+(y2-y1)*f+r()*2.2]); }
  }
  const last=stroke[stroke.length-1]; out.push([last[0]+r()*2, last[1]+r()*2]);
  return out;
}
const len = s => s.reduce((a,p,i)=>i?a+Math.hypot(p[0]-s[i-1][0],p[1]-s[i-1][1]):0,0);

function drawSketch(name, x, y, size, progress, seed){
  const strokes = (DRAW[name]||[]).map((s,i)=>wobbly(s, seed*100+i));
  const total = strokes.reduce((a,s)=>a+len(s),0);
  let budget = total*progress;
  const k = size/200;
  ctx.save(); ctx.translate(x,y); ctx.scale(k,k);
  ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#1d1d1d'; ctx.lineWidth=14/k;
  for (const s of strokes){
    if (budget<=0) break;
    ctx.beginPath(); ctx.moveTo(...s[0]);
    for (let i=1;i<s.length;i++){
      const d=Math.hypot(s[i][0]-s[i-1][0],s[i][1]-s[i-1][1]);
      if (d<=budget){ ctx.lineTo(...s[i]); budget-=d; }
      else { const f=budget/d; ctx.lineTo(s[i-1][0]+(s[i][0]-s[i-1][0])*f, s[i-1][1]+(s[i][1]-s[i-1][1])*f); budget=0; break; }
    }
    ctx.stroke();
  }
  ctx.restore();
}

function paper(){
  ctx.fillStyle='#fbf8f1'; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#e7e0cf'; ctx.lineWidth=2;
  for (let y=140;y<H;y+=70){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
}

function header(){
  ctx.fillStyle='#1d1d1d'; ctx.font='64px "Gochi Hand"'; ctx.textAlign='center';
  ctx.fillText(sc.title, W/2, 150);
  // barra realismo → ciencia ficción
  const x0=170, x1=W-170, y=230;
  ctx.strokeStyle='#1d1d1d'; ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo(x0,y); ctx.lineTo(x1,y); ctx.stroke();
  ctx.font='36px "Patrick Hand"'; ctx.textAlign='left'; ctx.fillText('REALISTA', x0-10, y+55);
  ctx.textAlign='right'; ctx.fillText('CIENCIA FICCIÓN', x1+10, y+55);
  const mx = x1 - (x1-x0)*(sc.realism-1)/9;
  ctx.fillStyle='#c8372d'; ctx.beginPath(); ctx.arc(mx,y,18,0,Math.PI*2); ctx.fill();
}

function caption(text, progress){
  const words = text.split(/\s+/).filter(Boolean);
  const shown = Math.ceil(words.length*Math.min(1,progress));
  ctx.font='76px "Patrick Hand"'; ctx.textAlign='left';
  const maxW = W-160, lh=92, lines=[[]]; let lw=0;
  const space = ctx.measureText(' ').width;
  for (const w of words){
    const clean=w.replace(/\*/g,''), ww=ctx.measureText(clean).width;
    if (lw+ww>maxW && lines.at(-1).length){ lines.push([]); lw=0; }
    lines.at(-1).push(w); lw+=ww+space;
  }
  let i=0, y=H-560+(5-lines.length)*lh/2, hl=false;
  for (const line of lines){
    const lineW = line.reduce((a,w)=>a+ctx.measureText(w.replace(/\*/g,'')).width+space,0)-space;
    let x=(W-lineW)/2;
    for (const w of line){
      const start=w.startsWith('*'), end=w.replace(/[.,:;!?)]+$/,'').endsWith('*');
      if (start) hl=true;
      const clean=w.replace(/\*/g,'');
      if (i<shown){ ctx.fillStyle = hl ? '#c8372d' : '#1d1d1d'; ctx.fillText(clean,x,y); }
      if (end) hl=false;
      x+=ctx.measureText(clean).width+space; i++;
    }
    y+=lh;
  }
}

function render(t){
  const ends=[]; let acc=0; for (const s of sc.scenes){ acc+=s.dur; ends.push(acc); }
  let idx = ends.findIndex(e=>t<e); if (idx<0) idx=sc.scenes.length-1;
  const s = sc.scenes[idx]; if (!s) { paper(); header(); return; }
  const local = t-(ends[idx]-s.dur), p = local/s.dur;
  paper(); header();
  const draws = s.draw.filter(d=>d && d!=='ninguno');
  const pd = Math.min(1, p/0.45);
  if (draws.length===1) drawSketch(draws[0], W/2-380, 360, 760, pd, idx+1);
  else draws.slice(0,2).forEach((d,j)=>drawSketch(d, 60+j*500, 480, 460, Math.min(1, Math.max(0,(p-j*0.12)/0.4)), idx*10+j+1));
  caption(s.text, Math.min(1, p/0.6));
  // número de escena
  ctx.fillStyle='#6b6b6b'; ctx.font='34px "Patrick Hand"'; ctx.textAlign='center';
  ctx.fillText(`${idx+1} / ${sc.scenes.length}`, W/2, H-90);
  document.querySelectorAll('.scene').forEach((el,i)=>el.classList.toggle('active', i===idx));
}

function totalDur(){ return sc.scenes.reduce((a,s)=>a+s.dur,0); }
function loop(now){
  const t=(now-t0)/1000;
  if (t>=totalDur()){ render(totalDur()-0.001); playing=false; const f=onEnd; onEnd=null; f&&f(); return; }
  render(t); rafId=requestAnimationFrame(loop);
}
function play(cb){ cancelAnimationFrame(rafId); playing=true; onEnd=cb||null; t0=performance.now(); rafId=requestAnimationFrame(loop); }
function stop(){ cancelAnimationFrame(rafId); playing=false; onEnd=null; }

// ---------- Editor ----------
const $scenes=document.getElementById('scenes');
const opts = Object.keys(DRAW).map(k=>`<option>${k}</option>`).join('');
function buildEditor(){
  document.getElementById('title').value=sc.title;
  document.getElementById('realism').value=sc.realism;
  $scenes.innerHTML='';
  sc.scenes.forEach((s,i)=>{
    const el=document.createElement('div'); el.className='scene';
    el.innerHTML=`<div class="row"><b>Escena ${i+1}</b>
      <select data-k="d0">${opts}</select><select data-k="d1">${opts}</select>
      <label>seg <input type="number" min="1" max="30" step="0.5" data-k="dur"></label>
      <button class="small" data-a="up">↑</button><button class="small" data-a="del">✕</button></div>
      <textarea data-k="text"></textarea>`;
    el.querySelector('[data-k=d0]').value=s.draw[0]||'ninguno';
    el.querySelector('[data-k=d1]').value=s.draw[1]||'ninguno';
    el.querySelector('[data-k=dur]').value=s.dur;
    el.querySelector('[data-k=text]').value=s.text;
    el.addEventListener('input',()=>{
      s.draw=[el.querySelector('[data-k=d0]').value, el.querySelector('[data-k=d1]').value];
      s.dur=Math.max(1,+el.querySelector('[data-k=dur]').value||5);
      s.text=el.querySelector('[data-k=text]').value;
      preview(i);
    });
    el.querySelector('[data-a=del]').onclick=()=>{ sc.scenes.splice(i,1); buildEditor(); preview(0); };
    el.querySelector('[data-a=up]').onclick=()=>{ if(i){ [sc.scenes[i-1],sc.scenes[i]]=[sc.scenes[i],sc.scenes[i-1]]; buildEditor(); preview(i-1);} };
    el.addEventListener('click',e=>{ if(e.target.tagName==='DIV'||e.target.tagName==='B') preview(i); });
    $scenes.appendChild(el);
  });
}
function preview(i){ if(playing) return; let t=0; for(let k=0;k<i;k++) t+=sc.scenes[k].dur; render(t+(sc.scenes[i]?.dur||1)*0.99); }

const $preset=document.getElementById('preset');
$preset.innerHTML=PRESETS.map((p,i)=>`<option value="${i}">${i+1}. ${p.title} (${p.realism}/10)</option>`).join('');
$preset.onchange=()=>{ stop(); sc=structuredClone(PRESETS[+$preset.value]); buildEditor(); preview(0); };
document.getElementById('title').oninput=e=>{ sc.title=e.target.value; preview(0); };
document.getElementById('realism').oninput=e=>{ sc.realism=Math.min(10,Math.max(1,+e.target.value||1)); preview(0); };
document.getElementById('add').onclick=()=>{ sc.scenes.push({draw:['mochila','ninguno'], text:'Nueva escena', dur:5}); buildEditor(); preview(sc.scenes.length-1); };
document.getElementById('json').onclick=()=>{ navigator.clipboard?.writeText(JSON.stringify(sc,null,2)); status('Guion copiado al portapapeles'); };
document.getElementById('play').onclick=()=>play();
document.getElementById('stop').onclick=()=>{ stop(); preview(0); };

const $status=document.getElementById('status');
function status(m){ $status.textContent=m; }

document.getElementById('record').onclick=()=>{
  if (!window.MediaRecorder) return status('Este navegador no puede grabar vídeo. Usa Chrome o Edge.');
  const types=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm'];
  const mime=types.find(t=>MediaRecorder.isTypeSupported(t))||'';
  const rec=new MediaRecorder(cv.captureStream(30), {mimeType:mime, videoBitsPerSecond:8e6});
  const chunks=[]; rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  rec.onstop=()=>{
    const blob=new Blob(chunks,{type:mime||'video/webm'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download=`${sc.title.replace(/[^\wáéíóúñ ]/gi,'').trim().replace(/\s+/g,'-')}.${mime.includes('mp4')?'mp4':'webm'}`;
    a.click(); status('Vídeo descargado ✔');
  };
  rec.start(); status(`Grabando… (${totalDur()} s, no cambies de pestaña)`);
  play(()=>setTimeout(()=>rec.stop(), 300));
};

document.fonts.load('64px "Gochi Hand"').then(()=>document.fonts.load('76px "Patrick Hand"')).finally(()=>{ buildEditor(); preview(0); });
</script>
</body>
