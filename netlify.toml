##############################################################################
# SURVIVAL OFFLINE — configuración de despliegue en Netlify
#
# No hay bundler: `npm run build` solo genera los geodatos, los iconos y el
# manifiesto de precache. El directorio publicado es public/.
##############################################################################

[build]
  command = "npm run build"
  publish = "public"

[build.environment]
  NODE_VERSION = "22"

# ---------------------------------------------------------------------------
# SPA: cualquier ruta desconocida sirve index.html. La app usa rutas con
# hash (#/...), así que esto solo cubre enlaces profundos escritos a mano.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ---------------------------------------------------------------------------
# Cabeceras
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Cross-Origin-Opener-Policy = "same-origin"
    Permissions-Policy = "geolocation=(self), magnetometer=(self), accelerometer=(self), gyroscope=(self), camera=(), microphone=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # La app se autoabastece: solo se permiten recursos propios y las teselas
    # de mapa que el usuario decide descargar.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://www.ign.es; media-src 'self' blob:; connect-src 'self' https://*.supabase.co https://*.supabase.in https://www.ign.es; font-src 'self'; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"

# El Service Worker nunca debe quedar cacheado: es quien controla las
# actualizaciones de todo lo demás.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/precache-manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# Contenido y código: el Service Worker se encarga de refrescarlos por versión.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/data/geo/*.geojson"
  [headers.values]
    Content-Type = "application/geo+json; charset=utf-8"
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
